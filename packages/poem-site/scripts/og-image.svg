<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f27aad" />
			<stop offset=".55" stop-color="#ffc3d8" />
			<stop offset="1" stop-color="#ffe6d5" />
		</linearGradient>
		<radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
			<stop offset="0" stop-color="#fffaf0" stop-opacity="1" />
			<stop offset=".2" stop-color="#fff1d6" stop-opacity=".95" />
			<stop offset=".45" stop-color="#ffd9a8" stop-opacity=".35" />
			<stop offset="1" stop-color="#ffc3d8" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="ray" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="#fff3dc" stop-opacity=".75" />
			<stop offset="1" stop-color="#fff3dc" stop-opacity="0" />
		</linearGradient>
		<linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#e0367a" />
			<stop offset=".6" stop-color="#ff7a59" />
			<stop offset="1" stop-color="#f2a33a" />
		</linearGradient>
		<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="14" />
		</filter>
		<filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
			<feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#782050" flood-opacity=".28" />
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#sky)" />

	<!-- sun + rays -->
	<g transform="translate(905 300)">
		<g opacity=".9">
			<polygon points="-14,0 14,0 0,-330" fill="url(#ray)" transform="rotate(-70)" />
			<polygon points="-10,0 10,0 0,-260" fill="url(#ray)" transform="rotate(-45)" />
			<polygon points="-14,0 14,0 0,-330" fill="url(#ray)" transform="rotate(-20)" />
			<polygon points="-10,0 10,0 0,-260" fill="url(#ray)" transform="rotate(5)" />
			<polygon points="-14,0 14,0 0,-330" fill="url(#ray)" transform="rotate(30)" />
			<polygon points="-10,0 10,0 0,-260" fill="url(#ray)" transform="rotate(55)" />
			<polygon points="-14,0 14,0 0,-330" fill="url(#ray)" transform="rotate(80)" />
		</g>
		<circle r="230" fill="url(#sunGlow)" />
		<circle r="62" fill="#fffaf0" />
	</g>

	<!-- the last grey cloud, getting pushed out of frame (with a couple of bugs fleeing) -->
	<g opacity=".92">
		<g fill="#a594b4">
			<ellipse cx="1040" cy="120" rx="70" ry="38" />
			<ellipse cx="1100" cy="100" rx="60" ry="44" />
			<ellipse cx="1160" cy="126" rx="70" ry="36" />
			<ellipse cx="1090" cy="140" rx="90" ry="28" />
		</g>
		<g fill="#2e2530">
			<polygon points="972,170 984,160 986,176" />
			<polygon points="948,196 958,188 961,201" />
			<polygon points="1006,196 1015,190 1016,202" />
		</g>
	</g>

	<!-- fair clouds -->
	<g fill="#fff4f8" opacity=".95">
		<ellipse cx="660" cy="150" rx="70" ry="26" />
		<ellipse cx="700" cy="134" rx="46" ry="30" />
		<ellipse cx="740" cy="152" rx="62" ry="22" />
		<ellipse cx="300" cy="80" rx="60" ry="20" opacity=".7" />
		<ellipse cx="336" cy="68" rx="38" ry="24" opacity=".7" />
	</g>

	<!-- low-poly hills -->
	<polygon points="520,630 640,380 760,470 860,360 1000,460 1110,350 1200,420 1200,630" fill="#c98bb6" />
	<polygon points="640,380 700,450 760,470" fill="#b47ead" />
	<polygon points="860,360 920,430 1000,460" fill="#b47ead" />
	<polygon points="1110,350 1150,410 1200,420" fill="#b47ead" />
	<polygon points="0,630 0,470 140,420 260,500 400,430 560,520 700,470 860,540 1000,480 1200,530 1200,630" fill="#e48ab3" />
	<polygon points="140,420 200,480 260,500" fill="#d77aa7" />
	<polygon points="400,430 480,490 560,520" fill="#d77aa7" />
	<polygon points="700,470 780,520 860,540" fill="#d77aa7" />
	<polygon points="0,630 0,560 200,540 420,590 640,560 860,600 1060,570 1200,590 1200,630" fill="#f7a6c2" />

	<!-- floating solids -->
	<g opacity=".95">
		<polygon points="610,290 636,276 650,302 624,318" fill="#ffe08a" />
		<polygon points="610,290 636,276 624,318" fill="#ffd060" />
		<circle cx="1080" cy="250" r="16" fill="none" stroke="#d9a6ff" stroke-width="9" />
		<polygon points="760,250 778,222 796,250 778,278" fill="#ff8fb8" />
		<polygon points="760,250 778,222 778,278" fill="#ff74a6" />
		<text x="1010" y="215" font-family="Georgia, serif" font-style="italic" font-size="44" fill="#fff6fa" opacity=".9">?</text>
		<text x="690" y="230" font-family="Georgia, serif" font-style="italic" font-size="36" fill="#fff6fa" opacity=".85">!</text>
	</g>

	<!-- forecast card -->
	<g filter="url(#shadow)">
		<rect x="64" y="110" width="520" height="380" rx="32" fill="#fff4f8" fill-opacity=".86" stroke="#ffffff" stroke-opacity=".9" stroke-width="2" />
	</g>
	<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#7a4b6b">
		<text x="104" y="170" font-size="17" font-weight="700" letter-spacing="5">TODAY'S FORECAST</text>
	</g>
	<g font-family="Georgia, 'Times New Roman', serif" fill="#4a2440">
		<text x="100" y="262" font-size="84" letter-spacing="-2">100%</text>
		<text x="104" y="318" font-size="40">chance of</text>
		<text x="292" y="318" font-size="52" font-style="italic" font-weight="700" fill="url(#word)">Math</text>
	</g>
	<line x1="104" y1="352" x2="544" y2="352" stroke="#e7b6cc" stroke-width="2" />
	<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#7a4b6b">
		<text x="104" y="392">Bugs <tspan font-weight="700" fill="#4a2440">scattering</tspan></text>
		<text x="330" y="392">Despair <tspan font-weight="700" fill="#4a2440">0%</tspan></text>
		<text x="104" y="430">Curiosity <tspan font-weight="700" fill="#4a2440">off the charts</tspan></text>
		<text x="104" y="468">Outlook <tspan font-weight="700" fill="#e0367a">dazzling ✦</tspan></text>
	</g>

	<text x="64" y="572" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#ffffff">scroll slowly… the weather changes</text>
</svg>
